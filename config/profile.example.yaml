# JobFlow — candidate profile
#
# Copy this file to `profile.yaml` and replace every value with your own.
# `profile.yaml` is gitignored, so your details never reach the repository.
#
#   cp profile.example.yaml profile.yaml      (Windows: copy ...)
#
# Every value here is written verbatim into real application forms, so a
# wrong value reaches a real employer. Check it before your first live run.

identity:
  first_name: "Your"
  middle_name: ""
  last_name: "Name"
  email: "you@example.com"
  phone: "9999999999"              # digits only, no spaces or dashes
  phone_country_code: "+91"
  linkedin_url: "https://www.linkedin.com/in/your-profile/"
  website: ""                      # portfolio or blog; "" if you have none

location:
  city: "Your City"
  street: "Your Street"
  state: "Your State"
  zipcode: "000000"
  country: "Your Country"

professional:
  headline: "Your LinkedIn headline"
  years_of_experience: 5
  has_masters: false               # true adds a 2-year experience tolerance
  recent_employer: "Your Employer"
  # Absolute path to the PDF you want uploaded. Loading fails if it is missing.
  resume_path: "C:/path/to/your_resume.pdf"
  summary: |
    A few paragraphs about your work. Used for "tell us about yourself" and
    cover-letter style questions.

compensation:
  current_ctc: 1000000             # annual, in whole units of your currency
  desired_salary: 1200000
  currency: "INR"
  notice_period_days: 30

eligibility:
  requires_visa_sponsorship: false
  # One of LinkedIn's citizenship options, matched against the dropdown.
  work_authorization: "Non-citizen allowed to work for any employer"
  has_security_clearance: false

# Optional EEO answers. Use "Decline" to decline to self-identify.
demographics:
  gender: "Decline"
  ethnicity: "Decline"
  disability_status: "Decline"
  veteran_status: "Decline"

# Fallback for numeric self-rating questions ("on a scale of 1-10...")
defaults:
  confidence_level: 8

# Standard yes/no questions that application forms ask over and over.
# These are your real answers, so check them before your first live run.
#
# Use "Yes", "No", "Decline", or "" (empty) to leave a question unanswered
# so JobFlow stops and asks you instead of guessing.
screening:
  # Honesty checks. Answer these truthfully -- they are verified.
  criminal_record: "No"
  background_check_consent: "Yes"
  drug_test_consent: "Yes"

  # What you are willing to do.
  willing_night_shift: "Yes"
  willing_weekends: "Yes"
  willing_relocate: "Yes"
  willing_travel: "Yes"
  willing_overtime: "Yes"

  # Your history with the company you are applying to.
  applied_before_recently: "No"     # applied here in the last 6 months
  previously_employed_here: "No"
  related_to_employee: "No"
  non_compete_agreement: "No"       # bound by one that would block this job

  # Practical details.
  currently_employed: "Yes"
  has_driving_licence: "Yes"
  has_own_equipment: "Yes"          # own laptop / reliable internet
  can_start_immediately: "Yes"

  has_passport: "Yes"
  willing_background_verification: "Yes"
  has_notice_period_buyout: "No"      # can your notice period be bought out
  open_to_contract: "Yes"

# Your own answers, for anything the built-in rules do not cover.
#
# The KEY is a distinctive phrase from the question (matched anywhere in it,
# case-insensitive); the VALUE is exactly what gets filled in. Longer phrases
# are matched first, and these beat every built-in rule -- so this is also how
# you correct a question JobFlow answers wrongly.
#
# Run with -v to see the questions JobFlow could not answer, then add them here.
custom:
  answers:
    # "how many years of python": "6"
    # "are you open to a hybrid role": "Yes"
    # "what is your father's name": "Example Name"
